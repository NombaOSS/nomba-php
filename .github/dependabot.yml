# Weekly update PRs. A routine update is only proposed once the release is a
# week old (cooldown); security updates ignore the cooldown.
version: 2
updates:
  # composer.json holds ranges: only widen one when a new release falls
  # outside it. Dev tooling is grouped into one PR.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase-if-necessary
    groups:
      dev-tooling:
        dependency-type: development
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
